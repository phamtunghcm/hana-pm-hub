name: Send Daily Report at 8 AM

on:
  schedule:
    # 8 AM GMT+7 is 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily Report Script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          ZALO_WEBHOOK_URL: ${{ secrets.ZALO_WEBHOOK_URL }}
        run: python scripts/send_daily_report.py
